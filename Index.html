<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una flor para ti 🌸</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    min-height: 100vh;
    background: linear-gradient(180deg, #ffdbe8, #fff0f5);
    font-family: "Segoe UI", sans-serif;
    transition: background 2s ease;
}

/* =========================
   PANTALLA PRINCIPAL
========================= */

.scene {
    width: 100vw;
    height: 100vh;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 1.5s ease;
}

/* Texto superior */

.instruction {
    position: absolute;
    top: 7%;
    width: 100%;
    text-align: center;
    color: #9d3158;
    font-size: clamp(18px, 3vw, 27px);
    font-weight: 600;
    letter-spacing: .5px;
    animation: floating 3s ease-in-out infinite;
}

.instruction small {
    display: block;
    margin-top: 8px;
    font-size: 14px;
    opacity: .65;
    font-weight: normal;
}

/* =========================
   FLOR
========================= */

.flower {
    width: 420px;
    height: 420px;
    position: relative;
    transform-origin: center;
}

/* Pétalos */

.petal {
    position: absolute;
    width: 105px;
    height: 175px;
    left: 157px;
    top: 122px;

    border-radius: 70% 70% 45% 45%;

    background:
        radial-gradient(circle at 35% 25%,
        #fff 0%,
        #ffd1e0 20%,
        #ff9fbd 55%,
        #ed5d8d 100%);

    box-shadow:
        inset 0 -10px 20px rgba(190, 30, 90, .15),
        0 8px 18px rgba(180, 50, 100, .18);

    transform-origin: 52px 88px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    transition:
        transform .5s cubic-bezier(.2,.8,.2,1),
        filter .3s,
        opacity .5s;
}

/* Posiciones de los pétalos */

.petal:nth-child(1) {
    transform: rotate(0deg) translateY(-120px);
}

.petal:nth-child(2) {
    transform: rotate(45deg) translateY(-120px);
}

.petal:nth-child(3) {
    transform: rotate(90deg) translateY(-120px);
}

.petal:nth-child(4) {
    transform: rotate(135deg) translateY(-120px);
}

.petal:nth-child(5) {
    transform: rotate(180deg) translateY(-120px);
}

.petal:nth-child(6) {
    transform: rotate(225deg) translateY(-120px);
}

.petal:nth-child(7) {
    transform: rotate(270deg) translateY(-120px);
}

.petal:nth-child(8) {
    transform: rotate(315deg) translateY(-120px);
}

/* Hover */

.petal:hover {
    filter: brightness(1.08);
}

/* Cuando un pétalo fue abierto */

.petal.opened {
    filter: brightness(1.15);
}

/* =========================
   CENTRO
========================= */

.center {
    position: absolute;
    width: 105px;
    height: 105px;

    left: 157px;
    top: 157px;

    border-radius: 50%;

    background:
        radial-gradient(circle at 35% 30%,
        #fffbd1,
        #ffd85c 35%,
        #f4a900 75%);

    box-shadow:
        0 0 25px rgba(255, 187, 50, .55),
        inset 0 -7px 10px rgba(150, 90, 0, .15);

    z-index: 20;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #9b6100;
    font-size: 30px;
}

/* =========================
   FRASE
========================= */

.message {
    position: absolute;

    left: 50%;
    bottom: 7%;

    transform: translateX(-50%) scale(.8);

    width: min(90%, 600px);

    padding: 18px 25px;

    text-align: center;

    color: #8c294d;

    font-size: clamp(18px, 3vw, 25px);
    font-weight: 600;

    background: rgba(255,255,255,.65);
    backdrop-filter: blur(12px);

    border-radius: 30px;

    box-shadow: 0 10px 35px rgba(150, 30, 80, .12);

    opacity: 0;

    transition:
        opacity .5s,
        transform .5s;

    pointer-events: none;
}

.message.show {
    opacity: 1;
    transform: translateX(-50%) scale(1);
}

/* =========================
   CONTADOR
========================= */

.counter {
    position: absolute;
    top: 14%;
    right: 5%;

    padding: 8px 15px;

    border-radius: 30px;

    background: rgba(255,255,255,.6);
    color: #a2375d;

    font-size: 14px;
}

/* =========================
   ANIMACIÓN FINAL
========================= */

.flower.spinning {
    animation: flowerSpin 3s cubic-bezier(.65,0,.35,1) forwards;
}

@keyframes flowerSpin {

    0% {
        transform: scale(1) rotate(0deg);
    }

    40% {
        transform: scale(1.15) rotate(360deg);
    }

    70% {
        transform: scale(.95) rotate(720deg);
    }

    100% {
        transform: scale(.2) rotate(1080deg);
        opacity: 0;
    }
}

/* =========================
   PANTALLA FINAL
========================= */

.final-screen {
    position: fixed;

    inset: 0;

    background: #000;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-direction: column;

    opacity: 0;

    pointer-events: none;

    transition: opacity 2.5s ease;

    z-index: 100;
}

.final-screen.show {
    opacity: 1;
    pointer-events: all;
}

.final-text {
    color: white;

    text-align: center;

    padding: 30px;

    max-width: 850px;

    opacity: 0;

    transform: translateY(25px);

    transition:
        opacity 2s ease,
        transform 2s ease;
}

.final-screen.show .final-text {
    opacity: 1;
    transform: translateY(0);
}

.final-text .small {
    font-size: clamp(17px, 3vw, 24px);
    color: #aaa;
    margin-bottom: 22px;
}

.final-text h1 {
    font-size: clamp(30px, 7vw, 65px);
    font-weight: 500;

    color: #fff;

    text-shadow:
        0 0 20px rgba(255,255,255,.2);
}

.final-text h1 span {
    color: #ff9fbd;
}

.final-text .heart {
    display: block;

    margin-top: 30px;

    font-size: 40px;

    animation: heartbeat 1.5s infinite;
}

@keyframes heartbeat {
    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.2);
    }
}

/* =========================
   ANIMACIONES
========================= */

@keyframes floating {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-6px);
    }
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px) {

    .flower {
        transform: scale(.75);
    }

    .flower.spinning {
        animation: flowerSpinMobile 3s forwards;
    }

    .counter {
        top: 18%;
        right: 50%;
        transform: translateX(50%);
    }

    @keyframes flowerSpinMobile {

        0% {
            transform: scale(.75) rotate(0);
        }

        40% {
            transform: scale(.9) rotate(360deg);
        }

        70% {
            transform: scale(.7) rotate(720deg);
        }

        100% {
            transform: scale(.1) rotate(1080deg);
            opacity: 0;
        }
    }
}
</style>
</head>

<body>

<div class="scene" id="scene">

    <div class="instruction">
        Hay algo que quiero decirte... 🌸
        <small>toca cada pétalo</small>
    </div>

    <div class="counter" id="counter">
        0 / 8
    </div>

    <div class="flower" id="flower">

        <div class="petal"
             data-message="Amo tus ojos. Hay algo en ellos que simplemente me encanta. ❤️">
        </div>

        <div class="petal"
             data-message="Adoro tu sonrisa. Cada vez que la imagino, no puedo evitar sonreír también. 🌸">
        </div>

        <div class="petal"
             data-message="Amo tu forma de ser. No cambiaría esa manera tan tuya de ser por nada. 💗">
        </div>

        <div class="petal"
             data-message="Amo tu forma de hablar, tu voz cuando charlamos y hasta la manera en que escribes tus mensajes. 💌">
        </div>

        <div class="petal"
             data-message="Me encanta cuando hablamos. Incluso una conversación cualquiera contigo termina siendo especial. ✨">
        </div>

        <div class="petal"
             data-message="Me encanta cómo puedes hacer que un día normal se sienta muchísimo más bonito. 🌷">
        </div>

        <div class="petal"
             data-message="Me gustas por todas esas pequeñas cosas que quizá tú ni siquiera notas, pero que yo sí. 💕">
        </div>

        <div class="petal"
             data-message="Y después de todo... creo que ya no sé cómo decirlo de otra manera. Te amo a ti. ❤️">
        </div>

        <div class="center">
            ♥
        </div>

    </div>

    <div class="message" id="message"></div>

</div>


<!-- PANTALLA FINAL -->

<div class="final-screen" id="finalScreen">

    <div class="final-text">

        <div class="small">
            Y ahora que viste todo lo que siento...
        </div>

        <h1>
            Por favor...<br>
            esta vez, en serio...<br><br>
            <span>sé mi novia.</span>
        </h1>

        <span class="heart">♥</span>

    </div>

</div>


<script>

const petals = document.querySelectorAll(".petal");
const message = document.getElementById("message");
const counter = document.getElementById("counter");
const flower = document.getElementById("flower");
const scene = document.getElementById("scene");
const finalScreen = document.getElementById("finalScreen");

let opened = 0;
let finished = false;


/* =========================
   CLICK EN PÉTALOS
========================= */

petals.forEach((petal) => {

    petal.addEventListener("click", () => {

        if (finished) return;

        const text = petal.dataset.message;

        message.textContent = text;

        message.classList.remove("show");

        setTimeout(() => {
            message.classList.add("show");
        }, 30);


        if (!petal.classList.contains("opened")) {

            petal.classList.add("opened");

            opened++;

            counter.textContent = `${opened} / 8`;

        }


        /* =========================
           TODOS LOS PÉTALOS
        ========================= */

        if (opened === petals.length) {

            finished = true;

            setTimeout(() => {

                message.classList.remove("show");

                flower.classList.add("spinning");

                setTimeout(() => {

                    scene.style.opacity = "0";

                }, 1800);


                setTimeout(() => {

                    finalScreen.classList.add("show");

                }, 3200);

            }, 2200);

        }

    });

});


/* =========================
   EVITAR SELECCIÓN
========================= */

document.addEventListener("selectstart", e => {
    e.preventDefault();
});

</script>

</body>
</html>
